<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PCG Scan — self test</title>
    <link rel="stylesheet" href="../css/app.css" />
    <style>
      main { max-width: 720px; }
      h1 { font-family: var(--font-head); font-size: 1.2rem; }
      .intro { font-size: 0.85rem; color: var(--text-dim); line-height: 1.55; }
      .summary {
        margin: 1rem 0;
        padding: 0.7rem 0.9rem;
        border-radius: 10px;
        background: var(--surface);
        border-left: 3px solid var(--pcg-blue);
        font-weight: 600;
      }
      .summary.pass { border-left-color: var(--pcg-green); color: var(--pcg-green-light); }
      .summary.fail { border-left-color: var(--danger); color: #ffd9d4; }
      .case {
        display: grid;
        grid-template-columns: 92px 1fr;
        gap: 0.9rem;
        align-items: start;
        padding: 0.8rem 0;
        border-top: 1px solid var(--border);
      }
      .case img {
        width: 92px;
        background: #fff;
        border-radius: 6px;
        padding: 4px;
      }
      .case h2 { margin: 0 0 0.3rem; font-size: 0.9rem; font-family: var(--font-head); }
      .verdict { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.04em; }
      .verdict.pass { color: var(--pcg-green-light); }
      .verdict.fail { color: var(--danger); }
      .detail {
        margin: 0.35rem 0 0;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.72rem;
        color: var(--text-dim);
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      .timing { color: var(--pcg-gray); }
    </style>
  </head>
  <body>
    <main>
      <h1>PCG Scan — device self test</h1>
      <p class="intro">
        Decodes a known symbol of every supported format on <em>this</em> device and
        checks the parsed output, so a device-specific failure can be told apart
        from a bad label. The images are generated by an independent encoder
        (BWIPP), not by the decoder under test.
      </p>
      <div class="summary" id="summary">Running…</div>
      <div id="cases"></div>
    </main>

    <script type="module">
      import { decodeStill, formatLabel } from "../js/decode.js";
      import { parse } from "../js/parsers/index.js";

      const cases = document.getElementById("cases");
      const summary = document.getElementById("summary");

      const manifest = await (await fetch("./fixtures/manifest.json")).json();
      let passed = 0;
      const failed = [];

      for (const item of manifest) {
        const row = document.createElement("div");
        row.className = "case";

        const img = document.createElement("img");
        img.src = `./fixtures/${item.file}`;
        img.alt = item.title;
        row.append(img);

        const body = document.createElement("div");
        const title = document.createElement("h2");
        title.textContent = item.title;
        body.append(title);

        const verdict = document.createElement("div");
        verdict.className = "verdict";
        body.append(verdict);

        const detail = document.createElement("p");
        detail.className = "detail";
        body.append(detail);
        row.append(body);
        cases.append(row);

        const problems = [];
        let elapsed = 0;
        try {
          const blob = await (await fetch(img.src)).blob();
          const t0 = performance.now();
          const results = await decodeStill(blob);
          elapsed = performance.now() - t0;

          if (!results.length) {
            problems.push("no symbol decoded");
          } else {
            const r = results[0];
            const parsed = parse(r);

            if (r.format !== item.expect.format) {
              problems.push(`format ${r.format}, expected ${item.expect.format}`);
            }
            if (r.text !== item.text) {
              problems.push(`payload mismatch: ${JSON.stringify(r.text.slice(0, 70))}`);
            }
            if (parsed.kind !== item.expect.kind) {
              problems.push(`parsed as "${parsed.kind}", expected "${item.expect.kind}"`);
            }
            for (const [label, value] of Object.entries(item.expect.fields ?? {})) {
              const f = parsed.fields.find((x) => x.label === label);
              if (!f) problems.push(`missing field "${label}"`);
              else if (String(f.value) !== value) {
                problems.push(`"${label}" = "${f.value}", expected "${value}"`);
              }
            }

            detail.textContent =
              `${formatLabel(r.format)} · ${r.contentType} · ${parsed.kind} · ` +
              `${parsed.fields.length} field(s)`;
          }
        } catch (err) {
          problems.push(`threw: ${err.message}`);
        }

        if (problems.length) {
          failed.push(item.title);
          verdict.textContent = "FAIL";
          verdict.classList.add("fail");
          detail.textContent = problems.join(" · ");
        } else {
          passed++;
          verdict.textContent = "PASS";
          verdict.classList.add("pass");
          const t = document.createElement("span");
          t.className = "timing";
          t.textContent = `  ${elapsed.toFixed(0)} ms`;
          verdict.append(t);
        }
      }

      summary.textContent = `${passed} of ${manifest.length} formats decoded and parsed correctly`;
      summary.classList.add(failed.length ? "fail" : "pass");
      if (failed.length) summary.textContent += ` — failed: ${failed.join(", ")}`;
    </script>
  </body>
</html>
