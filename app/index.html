<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PCG Scan</title>
    <meta
      name="description"
      content="Peterson Corn Genetics barcode scanner — PDF417, Data Matrix, QR Code, MaxiCode and Aztec."
    />

    <link rel="manifest" href="./manifest.webmanifest" />

    <!--
      theme-color is managed by js/theme.js (and the inline script below) rather
      than by media-scoped tags, because an explicit light/dark choice has to be
      able to override the phone's setting — which a media query cannot express.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />

    <!--
      Classic (non-deferred) script, so the theme is applied before first paint
      and nobody whose choice differs from their phone setting sees a flash of
      the wrong theme. Must stay above the stylesheet link.
    -->
    <script src="./js/theme-init.js"></script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      Not "black-translucent": despite the name it forces WHITE status-bar text,
      which was fine when this app was dark-only but is unreadable over a light
      background. There is no media-query form of this tag, so "default" plus the
      theme-color tags above is the workable combination — iOS 15+ tints the
      status bar from theme-color and picks readable text itself.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PCG Scan" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" />

    <!--
      Prompt (headings) and Montserrat (body) are the PCG brand faces. They are
      loaded from Google Fonts rather than self-hosted, so offline use falls back
      to the system stack declared in app.css. Swap in self-hosted WOFF2 files if
      brand-exact type offline becomes a requirement.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">
          <span class="brand-pcg">PCG</span>
          <span class="brand-app">Scan</span>
        </span>
      </div>
      <button
        id="btn-diag"
        class="icon-btn"
        type="button"
        aria-pressed="false"
        title="Show scan diagnostics"
      >
        Stats
      </button>
    </header>

    <main>
      <section class="stage" id="stage" aria-label="Camera preview">
        <video id="preview" playsinline muted></video>

        <div class="guide" id="guide" aria-hidden="true">
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>
          <span class="sweep"></span>
        </div>

        <p class="stage-idle">
          Reads <strong>PDF417</strong>, <strong>Data&nbsp;Matrix</strong>,
          <strong>QR&nbsp;Code</strong>, <strong>MaxiCode</strong> and <strong>Aztec</strong>.
        </p>

        <output id="diagnostics" class="diagnostics" hidden></output>
      </section>

      <p id="status" class="status" data-tone="info" role="status" hidden></p>

      <div class="controls">
        <button id="btn-start" class="btn btn-primary" type="button">Start scanning</button>
        <button id="btn-again" class="btn btn-primary" type="button" hidden>Scan another</button>
        <button id="btn-photo" class="btn btn-ghost" type="button">Scan a photo</button>
        <button
          id="btn-torch"
          class="btn btn-ghost"
          type="button"
          aria-pressed="false"
          hidden
        >
          Torch
        </button>
        <input
          id="file-input"
          class="visually-hidden"
          type="file"
          accept="image/*"
          capture="environment"
        />
      </div>

      <div class="tuning">
        <div class="control-row">
          <!-- A span, not a <label>: it names the whole group via
               aria-labelledby, and a <label for> here would make tapping the
               word "Theme" silently select Auto. -->
          <span class="row-label" id="theme-label">Theme</span>
          <!--
            Real radio inputs rather than buttons with aria-pressed: the browser
            then provides exclusive selection, arrow-key navigation and correct
            screen-reader semantics without custom keyboard handling.
          -->
          <div class="segmented" role="radiogroup" aria-labelledby="theme-label">
            <input
              class="visually-hidden"
              type="radio"
              name="theme"
              id="theme-auto"
              value="auto"
            />
            <label for="theme-auto" title="Follow the phone's own light/dark setting">
              Auto
            </label>
            <input
              class="visually-hidden"
              type="radio"
              name="theme"
              id="theme-light"
              value="light"
            />
            <label for="theme-light" title="Always light — easier to read in direct sunlight">
              Light
            </label>
            <input
              class="visually-hidden"
              type="radio"
              name="theme"
              id="theme-dark"
              value="dark"
            />
            <label for="theme-dark" title="Always dark — less glare in low light">Dark</label>
          </div>
        </div>
        <div class="control-row" id="camera-row" hidden>
          <label for="camera-select">Camera</label>
          <select id="camera-select"></select>
        </div>
        <div class="control-row" id="zoom-row" hidden>
          <label for="zoom-input">Zoom</label>
          <input id="zoom-input" type="range" min="1" max="4" step="0.1" value="1" />
        </div>
      </div>

      <section id="results" class="results" aria-live="polite" hidden></section>
    </main>

    <footer class="footer">
      <p>
        Peterson Corn Genetics · scanning happens entirely on this device — nothing
        is uploaded.
      </p>
    </footer>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
